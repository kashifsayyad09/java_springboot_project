name : Backend Build

on :
    # push:
    #   branches:
    #     - main
    workflow_dispatch:
    
permissions:
  id-token: write
  contents: read

jobs:
    build-deploy:
      runs-on: ubuntu-latest
      steps:
        #  ⭐️ 1. Checkout your code
      - name: Checkout Repository
        uses: actions/checkout@v2

        # ⭐️ 2. Sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://100.54.200.141:9000
        with:
          args: >
            -Dsonar.projectKey=dashboard-pipeline
            -Dsonar.sources=.  

        #⭐️ 3. Quality
      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        #⭐️ 4. Inqurey --> AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767397668494:role/OPENID
          aws-region: us-east-1

      - name: Install Java & Maven
        run: |
          COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
          "sudo yum install -y git",
          "sudo yum install -y maven",
          "sudo yum install -y java-17-amazon-corretto"
          ]' \
          --query "Command.CommandId" \
          --output text)

          aws ssm wait command-executed \
          --command-id $COMMAND_ID \
          --instance-id "${{ secrets.INSTANCE_ID }}"

      - name: Clone Repository
        run: |
          COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.INSTANCE_ID }}" \
          --document-name AWS-RunShellScript \
          --parameters 'commands=[
          "APP_DIR=/home/ec2-user/app",
          "REPO_NAME=java_springboot_project",
          "REPO_URL=https://github.com/kashifsayyad09/java_springboot_project.git",
          "mkdir -p $APP_DIR",
          "cd $APP_DIR",
          "if [ -d \"$REPO_NAME/.git\" ]; then cd $REPO_NAME && git reset --hard && git pull origin main; else git clone $REPO_URL && cd $REPO_NAME; fi"
          ]' \
          --query "Command.CommandId" \
          --output text)

          aws ssm wait command-executed \
          --command-id $COMMAND_ID \
          --instance-id "${{ secrets.INSTANCE_ID }}"

      - name: Build Application
        run: |
         COMMAND_ID=$(aws ssm send-command \
         --instance-ids "${{ secrets.INSTANCE_ID }}" \
         --document-name AWS-RunShellScript \
         --parameters 'commands=[
         "cd /home/ec2-user/app/java_springboot_project/backend",
         "mvn clean package -DskipTests -U"
         ]' \
         --query "Command.CommandId" \
         --output text)

         aws ssm wait command-executed \
         --command-id $COMMAND_ID \
         --instance-id "${{ secrets.INSTANCE_ID }}"    
    
      - name: Stop Old Application
        run: |
         COMMAND_ID=$(aws ssm send-command \
         --instance-ids "${{ secrets.INSTANCE_ID }}" \
         --document-name AWS-RunShellScript \
         --parameters 'commands=[
         "pkill -f datastore-0.0.7.jar || true"
         ]' \
         --query "Command.CommandId" \
         --output text)

          aws ssm wait command-executed \
           --command-id $COMMAND_ID \
           --instance-id "${{ secrets.INSTANCE_ID }}"

       - name: Start Application
         env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          run: |
           COMMAND_ID=$(aws ssm send-command \
           --instance-ids "${{ secrets.INSTANCE_ID }}" \
           --document-name AWS-RunShellScript \
           --parameters "commands=[
           \"mkdir -p /var/log/app\",
           \"nohup env MYSQL_HOST=$MYSQL_HOST MYSQL_PORT=$MYSQL_PORT MYSQL_USERNAME=$DB_USERNAME MYSQL_PASSWORD=$DB_PASSWORD java -jar /home/ec2-user/app/java_springboot_project/backend/target/datastore-0.0.7.jar --server.port=8084 >/var/log/app/nohup.out 2>&1 &\"
           ]" \
           --query "Command.CommandId" \
           --output text)

        aws ssm wait command-executed \
         --command-id $COMMAND_ID \
         --instance-id "${{ secrets.INSTANCE_ID }}"     
