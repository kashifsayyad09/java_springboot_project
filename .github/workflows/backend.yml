name : Backend Build

on :
    # push:
    #   branches:
    #     - main
    workflow_dispatch:
    
permissions:
  id-token: write
  contents: read

jobs:
    build-deploy:
      runs-on: ubuntu-latest
      steps:
        #  ⭐️ 1. Checkout your code
      - name: Checkout Repository
        uses: actions/checkout@v2

        # ⭐️ 2. Sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://100.54.200.141:9000
        with:
          args: >
            -Dsonar.projectKey=dashboard-pipeline
            -Dsonar.sources=.  

        #⭐️ 3. Quality
      - name: Check Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        #⭐️ 4. Inqurey --> AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::767397668494:role/OPENID
          aws-region: us-east-1

      - name: Deploy to EC2 using SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0e8386f79e9d51662" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "yum install -y ",
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e8386f79e9d51662"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e8386f79e9d51662" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0e8386f79e9d51662" \
            --query "Status" \
            --output text)

          echo "Deployment Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

    
