name: Backend Docker Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend

jobs:
  backend-deploy:
    runs-on: ubuntu-latest

    steps:
      ##################################################
      # 1. Checkout Repository
      ##################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ##################################################
      # 2. Setup Java
      ##################################################
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      ##################################################
      # 3. SonarQube Scan
      ##################################################
      - name: Build & SonarQube Scan
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn clean verify sonar:sonar \
            -DskipTests \
            -Dsonar.projectKey=backend \
            -Dsonar.projectName=backend \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

      ##################################################
      # 4. SonarQube Quality Gate
      ##################################################
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      ##################################################
      # 5. AWS OIDC Login
      ##################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN }}
          aws-region: ${{ env.AWS_REGION }}

      ##################################################
      # 6. Get AWS Account ID / Build ECR URI
      ##################################################
      - name: Configure ECR Variables
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          echo "Image URI: $IMAGE_URI"

      ##################################################
      # 7. Ensure ECR Repository Exists
      ##################################################
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      ##################################################
      # 8. Install Docker, Git & Trivy on EC2
      ##################################################
      - name: Install Docker Git and Trivy on EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo yum install -y git docker",
              "sudo systemctl enable docker",
              "sudo systemctl start docker",
              "sudo usermod -aG docker ec2-user",
              "if ! command -v trivy >/dev/null 2>&1; then sudo rpm -ivh https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.XX.X_Linux-64bit.rpm || true; fi",
              "mkdir -p /home/ec2-user/trivy-temp"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 9. Clone / Update Repository
      ##################################################
      - name: Clone Repository
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "APP_DIR=/home/ec2-user/app",
              "REPO_NAME=java_springboot_project",
              "REPO_URL=https://github.com/kashifsayyad09/java_springboot_project.git",
              "mkdir -p $APP_DIR",
              "cd $APP_DIR",
              "if [ -d \"$REPO_NAME/.git\" ]; then cd $REPO_NAME && git fetch origin && git reset --hard origin/main; else git clone $REPO_URL && cd $REPO_NAME; fi"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 10. Build Docker Image on EC2
      ##################################################
      - name: Build Docker Image
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/app/java_springboot_project/backend",
              "sudo docker build -t backend:${{ github.sha }} ."
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 11. Trivy Image Security Scan
      ##################################################
      - name: Trivy Image Scan
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "mkdir -p /home/ec2-user/trivy-temp",
              "sudo TMPDIR=/home/ec2-user/trivy-temp trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 backend:${{ github.sha }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 12. Login to Amazon ECR on EC2
      ##################################################
      - name: Login to Amazon ECR
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password \
            --region "${AWS_REGION}")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"echo '$ECR_PASSWORD' | sudo docker login --username AWS --password-stdin '${ECR_REGISTRY}'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 13. Tag & Push Image to ECR
      ##################################################
      - name: Push Docker Image to ECR
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"sudo docker tag backend:${GITHUB_SHA} ${IMAGE_URI}\",
              \"sudo docker push ${IMAGE_URI}\",
              \"sudo docker tag backend:${GITHUB_SHA} ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest\",
              \"sudo docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 14. Stop Old Container
      ##################################################
      - name: Stop Old Container
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo docker stop backend || true",
              "sudo docker rm backend || true"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 15. Start Container from ECR Image
      ##################################################
      - name: Start Docker Container
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"sudo docker pull ${IMAGE_URI}\",
              \"sudo docker run -d --name backend \
                -p 8084:8084 \
                -e MYSQL_HOST='$MYSQL_HOST' \
                -e MYSQL_PORT='$MYSQL_PORT' \
                -e MYSQL_USERNAME='$DB_USERNAME' \
                -e MYSQL_PASSWORD='$DB_PASSWORD' \
                --restart unless-stopped \
                '${IMAGE_URI}'\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 16. Health Check
      ##################################################
      - name: Verify Health
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sleep 20",
              "sudo docker ps --filter name=backend",
              "curl -f http://localhost:8084/actuator/health"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      ##################################################
      # 17. Deployment Report
      ##################################################
      - name: Send Deployment Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Backend Docker Deployment Report - ${{ github.repository }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}

            Deployment Type: Docker + Amazon ECR
            Image Tag: ${{ github.sha }}

            Pipeline:
            - SonarQube Scan
            - SonarQube Quality Gate
            - AWS OIDC Authentication
            - Docker Build
            - Trivy Vulnerability Scan
            - Amazon ECR Push
            - EC2 Deployment
            - Application Health Check
