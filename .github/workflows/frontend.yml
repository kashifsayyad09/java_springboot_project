name: Frontend Docker Deployment

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 615037471716
  ECR_REPOSITORY: frontend
  IMAGE_TAG: ${{ github.run_number }}
  IMAGE_URI: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=frontend
            -Dsonar.projectName=frontend
            -Dsonar.sources=frontend

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: docker build -t $IMAGE_URI ./frontend

      - name: Push Docker Image
        run: docker push $IMAGE_URI

      - name: Deploy to EC2
        env:
          API_URL: http://internal-backend-alb-1390412139.us-east-1.elb.amazonaws.com
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters "commands=[
            \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com\",
            \"sudo docker pull $IMAGE_URI\",
            \"OLD_IMAGE=\\$(sudo docker inspect frontend --format='{{.Config.Image}}' 2>/dev/null || true)\",
            \"sudo docker stop frontend || true\",
            \"sudo docker rm frontend || true\",
            \"sudo docker run -d --name frontend --restart unless-stopped -p 8501:8501 -e API_URL=$API_URL $IMAGE_URI\",
            \"sleep 20\",
            \"curl -f http://localhost:8501 || (echo Rollback && sudo docker stop frontend && sudo docker rm frontend && if [ -n \\\"\\$OLD_IMAGE\\\" ]; then sudo docker run -d --name frontend --restart unless-stopped -p 8501:8501 -e API_URL=$API_URL \\$OLD_IMAGE; fi; exit 1)\"
            ]" \
            --query Command.CommandId \
            --output text)

          aws ssm wait command-executed \
            --command-id $COMMAND_ID \
            --instance-id "${{ secrets.INSTANCE_ID }}"

      - name: Send Deployment Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Frontend Docker Deployment Report - ${{ github.repository }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
            Image: $IMAGE_URI
            Deployment: Docker + Amazon ECR
