name: Three-Tier Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.12.2"
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/envs/dev

jobs:

#########################################################
# Phase 1 - Core Infrastructure
#########################################################

  infrastructure-phase1:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Deploy VPC
        run: terraform apply -auto-approve -target=module.vpc

      - name: Deploy Bastion
        run: terraform apply -auto-approve -target=module.bastion

      - name: Deploy Frontend EC2
        run: terraform apply -auto-approve -target=module.frontend_ec2

      - name: Deploy Backend EC2
        run: terraform apply -auto-approve -target=module.backend_ec2

      - name: Deploy Frontend ALB
        run: terraform apply -auto-approve -target=module.frontend_alb

      - name: Deploy Backend ALB
        run: terraform apply -auto-approve -target=module.backend_alb

      - name: Deploy RDS
        run: terraform apply -auto-approve -target=module.rds

